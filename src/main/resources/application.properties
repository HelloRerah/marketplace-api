spring.application.name=marketplace-api

# Read DB_PASSWORD from the same .env file Docker uses
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3307/marketplace
spring.datasource.username=marketplace_app
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema. Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy